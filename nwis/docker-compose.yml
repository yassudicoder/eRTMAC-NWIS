# Local equivalent of the Render deployment.
#
#   docker compose up --build
#   -> http://localhost:8000
#
# This builds the same single-service image Render builds, with the same
# production environment, so what you see locally is what deploys. There is no
# second service: the API serves the dashboard from the same origin, which is
# the whole point of the deployment shape.

services:
  nwis:
    build:
      context: .
      dockerfile: Dockerfile
    image: nwis:local
    ports:
      # Render injects PORT; locally we pick one and pass it the same way, so
      # the $PORT code path is the one being exercised rather than a fallback
      # that only works here.
      - "8000:10000"
    environment:
      PORT: "10000"
      NWIS_ENV: production
      NWIS_AUTOSEED: "0"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
